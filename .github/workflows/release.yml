name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Test Equalizer APO imports
        run: swift test

      - name: Test driver transport
        run: Drivers/SystemAudioBridge/test-transport.sh

      - name: Build application
        run: ./build-app.sh

      - name: Verify bundle version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          bundle_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/CamillaApp.app/Contents/Info.plist)"
          if [[ "${GITHUB_REF_NAME}" != "v${bundle_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match bundle version v${bundle_version}."
            exit 1
          fi

      - name: Package application
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/CamillaApp.app/Contents/Info.plist)"
          app_archive="CamillaApp-v${version}-app.zip"
          build_archive="CamillaApp-v${version}-build-folder.zip"

          ditto -c -k --sequesterRsrc --keepParent \
            dist/CamillaApp.app "${app_archive}"
          ditto -c -k --sequesterRsrc --keepParent \
            dist "${build_archive}"
          shasum -a 256 \
            "${app_archive}" \
            "${build_archive}" > SHA256SUMS

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CamillaApp-macos
          path: |
            CamillaApp-v*-app.zip
            CamillaApp-v*-build-folder.zip
            SHA256SUMS
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: CamillaApp-macos

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            CamillaApp-v*-app.zip \
            CamillaApp-v*-build-folder.zip \
            SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "CamillaApp ${GITHUB_REF_NAME}"
